name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync backend dependencies
        run: uv sync --frozen --extra dev

      - name: Restore cached kr persona dataset
        id: cache-kr-personas
        uses: actions/cache@v4
        with:
          path: data/personas/kr/nemotron_personas.parquet
          key: persona-dataset-kr-v1

      - name: Download kr persona dataset
        if: steps.cache-kr-personas.outputs.cache-hit != 'true'
        run: uv run python scripts/download_dataset.py --country kr

      - name: Run backend + frontend static verification
        run: uv run python scripts/verify.py --skip-build --skip-dataset-tests
